<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OFFICE FIGHTER - Happy Hour Edition</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #wrap{position:relative;display:flex;align-items:center;justify-content:center;height:100%}
  #stack{position:relative}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
  #crt{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;
       background-image:linear-gradient(rgba(0,0,0,.22) 1px, transparent 1px);
       box-shadow:inset 0 0 120px rgba(0,0,0,.45)}
  #crt.off{display:none}
  /* ---- mobile rotate overlay ---- */
  #rotate{position:fixed;inset:0;background:#181828;z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;
    color:#f8d800;font:bold 6vmin monospace;letter-spacing:.5vmin}
  #rotate .ph{width:11vmin;height:19vmin;border:1.1vmin solid #f8f8f8;border-radius:2.5vmin;
    margin-bottom:5vmin;animation:rotph 1.5s ease-in-out infinite alternate}
  #rotate .sub{color:#40f0e0;font-size:3.2vmin;margin-top:2.5vmin}
  @keyframes rotph{0%,25%{transform:rotate(0)}75%,100%{transform:rotate(-90deg)}}
  /* ---- mobile touch controls ---- */
  #touch{position:fixed;inset:0;z-index:10;display:none;pointer-events:none}
  #dpad{position:absolute;left:3vmin;bottom:5vmin;width:38vmin;height:38vmin;
    pointer-events:auto;touch-action:none;opacity:.6}
  .arm{position:absolute;background:#1c1c26;border:2px solid #9090a0;box-sizing:border-box;
    color:#9090a0;display:flex;align-items:center;justify-content:center;font:bold 5vmin monospace}
  .arm.on{background:#f8d800;color:#181828;border-color:#fff}
  #d-up{left:33%;top:0;width:34%;height:34%;border-radius:15% 15% 0 0}
  #d-dn{left:33%;bottom:0;width:34%;height:34%;border-radius:0 0 15% 15%}
  #d-lf{left:0;top:33%;width:34%;height:34%;border-radius:15% 0 0 15%}
  #d-rt{right:0;top:33%;width:34%;height:34%;border-radius:0 15% 15% 0}
  #d-ct{left:33%;top:33%;width:34%;height:34%;background:#1c1c26;border:2px solid #9090a0}
  #btns{position:absolute;right:3vmin;bottom:5vmin;width:42vmin;height:40vmin;pointer-events:none}
  .abtn{position:absolute;width:15vmin;height:15vmin;border-radius:50%;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;font:bold 3.4vmin monospace;
    pointer-events:auto;touch-action:none;opacity:.65;color:#fff}
  .abtn.on{filter:brightness(1.9)}
  #b-p{right:19vmin;bottom:16vmin;background:#4a3c10;border:3px solid #f8d800}
  #b-k{right:1vmin;bottom:21vmin;background:#4a1c14;border:3px solid #f85838}
  #b-s{right:11vmin;bottom:1vmin;background:#0f3230;border:3px solid #40f0e0}
  #mid{position:absolute;left:50%;bottom:3vmin;transform:translateX(-50%);display:flex;gap:5vmin}
  .pill{padding:1.6vmin 4.5vmin;border:2px solid #9090a0;color:#d0d0d8;background:#1c1c26;
    font:bold 3vmin monospace;border-radius:2.5vmin;opacity:.7;pointer-events:auto;touch-action:none}
  .pill.on{background:#f8d800;color:#181828}
</style>
</head>

<div id="wrap"><div id="stack"><canvas id="game" width="320" height="200"></canvas><div id="crt"></div></div></div>
<div id="rotate"><div class="ph"></div>ROTATE YOUR PHONE<div class="sub">HOLD IT HORIZONTALLY TO FIGHT!</div></div>

    <div class="arm" id="d-rt">&#9654;</div>
    <div class="arm" id="d-ct"></div>

    <div class="abtn" id="b-k">KICK</div>

  </div>
  <div id="mid">
    <div class="pill" id="b-esc">ESC</div>
    <div class="pill" id="b-start">START</div>

</div>

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const stack = document.getElementById('stack'), crt = document.getElementById('crt');
const MOBILE = location.hash.includes('mobile') ||
  (matchMedia('(pointer: coarse)').matches && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window));
const rotDiv = document.getElementById('rotate'), touchUI = document.getElementById('touch');
function fit(){
  let k = Math.min(innerWidth/320, innerHeight/200);
  k = MOBILE ? Math.max(1, k) : Math.max(1, Math.floor(k));   // fractional scale on phones
  cv.style.width = (320*k)+'px'; cv.style.height = (200*k)+'px';
  crt.style.backgroundSize = '100% '+k+'px';
  const portrait = innerHeight > innerWidth;
  rotDiv.style.display = (MOBILE && portrait) ? 'flex' : 'none';
  touchUI.style.display = (MOBILE && !portrait) ? 'block' : 'none';
}
addEventListener('resize', fit);
addEventListener('orientationchange', ()=>{ setTimeout(fit, 200); });
fit();

function text(s, x, y, sc, col, align){
  s = String(s).toUpperCase();
  const w = s.length*4*sc - sc;
  if (align===1) x -= (w>>1); else if (align===2) x -= w;
  ctx.fillStyle = col;
  for (let i=0;i<s.length;i++){
    const g = FONT[s[i]] || FONT['?'];

      if ((g[r]>>(2-c))&1) ctx.fillRect(x+i*4*sc+c*sc, y+r*sc, sc, sc);
  }

let AC=null, musicOn=true, nextT=0, stepI=0, pattern=null;
function initAudio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function tone(f, dur, type, vol, slide, when){
  if(!AC) return;
  const t = when||AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur, vol, when){
  if(!AC) return;
  const t=when||AC.currentTime, n=AC.sampleRate*dur, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=b; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(g); g.connect(AC.destination); s.start(t);
}

function musicTick(){
  if(!AC || !pattern || !musicOn) return;
  while(nextT < AC.currentTime + .15){
    const i = stepI % 16, b = pattern.bass[i], l = pattern.lead[i];
    if(b!==null) tone(pattern.base*Math.pow(2,b/12), pattern.spb*.9, 'square', .035, 0, nextT);
    if(l!==null) tone(pattern.base*2*Math.pow(2,l/12), pattern.spb*.8, 'triangle', .028, 0, nextT);
    if(i%2===0) noise(.02,.012,nextT);
    nextT += pattern.spb; stepI++;
  }
}

// ============================== FIGHTER ==============================
const ATK = {
  punch:{su:5, act:4, rec:8, range:22, dmg:6, stun:13, kb:2.2, hy:-46, sfx:'hit'},
  kick: {su:9, act:5, rec:13, range:29, dmg:10, stun:18, kb:3.6, hy:-32, sfx:'kick'},
  air:  {su:4, act:99, rec:0, range:22, dmg:8, stun:16, kb:3.0, hy:-40, sfx:'hit'}
};
class Fighter {
  constructor(ci, x, face, cpu){
    this.c = ROSTER[ci]; this.ci = ci;
    this.x=x; this.y=GY; this.vx=0; this.vy=0; this.face=face;
    this.hp=this.c.hp; this.maxhp=this.c.hp;
    this.st='idle'; this.sT=0; this.atk=null; this.atkHit=false;
    this.cd=0; this.combo=0; this.cpu=cpu; this.grounded=true;
    this.pendShots=0; this.landLag=0; this.moveDir=0;
    this.ai={move:0, act:null, until:0};
  }
  get attacking(){ return this.st==='punch'||this.st==='kick'||this.st==='special'||this.st==='air'; }
  get busy(){ return this.attacking || this.st==='hit' || this.st==='block' || this.st==='ko' || this.st==='win'; }
  hurtbox(){
    if(this.c.key==='dog') return {x:this.x-16, y:this.y-46, w:32, h:46};
    return {x:this.x-10, y:this.y-64, w:20, h:64};
  }
  hitbox(){
    if(!this.atk) return null;
    const a = ATK[this.atk]||null;
    if(this.st==='special' && this.c.sp.type==='dash'){
      if(this.sT>=8 && this.sT<24) return {x:this.x+(this.face>0?0:-26), y:this.y-52, w:26, h:30};
      return null;
    }
    if(!a) return null;
    if(this.st==='air'){
      if(this.sT>=a.su && !this.grounded) return {x:this.x+(this.face>0?2:-2-a.range), y:this.y-32, w:a.range, h:30};
      return null;
    }
    const hy = this.c.key==='dog' ? -28 : a.hy;   // dog bites low
    if(this.sT>=a.su && this.sT<a.su+a.act)
      return {x:this.x+(this.face>0?8:-8-a.range), y:this.y+hy-6, w:a.range, h:14};
    return null;
  }
  update(inp, opp, FF){
    if(this.cd>0) this.cd--;
    if(this.landLag>0) this.landLag--;
    this.sT++;
    const away = (opp.x>this.x) ? inp.l : inp.r;
    const fwd  = (opp.x>this.x) ? inp.r : inp.l;
    this.holdingAway = away;

    switch(this.st){
      case 'idle': case 'walk': {
        if(!this.attacking) this.face = (opp.x>=this.x)?1:-1;
        let mv = 0;
        if(inp.l) mv=-1; else if(inp.r) mv=1;
        if(this.landLag>0) mv=0;
        this.moveDir = mv;
        this.vx = mv*this.c.spd;
        this.x += this.vx;
        this.st = mv? 'walk':'idle';
        if(inp.u && this.landLag<=0){
          this.vy=-this.c.jmp; this.grounded=false; this.st='jump'; this.sT=0; sfx.jump();
          if(inp.pe||inp.ke){ this.st='air'; this.atk='air'; this.atkHit=false; sfx.whiff(); }
        }
        else if(inp.pe){ this.startAtk('punch'); }
        else if(inp.ke){ this.startAtk('kick'); }
        else if(inp.se && this.cd<=0){ this.startSpecial(FF); }
        break;
      }
      case 'jump': {
        this.x += this.vx;
        this.vy += .25; this.y += this.vy;
        if(inp.pe||inp.ke){ this.st='air'; this.sT=0; this.atk='air'; this.atkHit=false; sfx.whiff(); }
        if(this.y>=GY){ this.land(); }
        break;
      }
      case 'air': {
        this.x += this.vx;
        this.vy += .25; this.y += this.vy;
        if(this.y>=GY){ this.land(); }
        break;
      }
      case 'punch': case 'kick': {
        const a = ATK[this.atk];
        if(this.sT>=a.su+a.act+a.rec){ this.st='idle'; this.atk=null; }
        break;
      }
      case 'special': {
        const sp = this.c.sp;
        if(sp.type==='proj'){
          if(this.sT===14){
            const n = sp.count||1;
            this.pendShots = n-1;
            FF.spawnProj(this, sp);
            sfx.special();
          }
          if(this.pendShots>0 && this.sT>14 && (this.sT-14)%9===0){ FF.spawnProj(this,this.c.sp); this.pendShots--; }
          if(this.sT>=30){ this.st='idle'; this.atk=null; }
        } else { // dash
          if(this.sT===8) sfx.special();
          if(this.sT>=8 && this.sT<24){ this.x += this.face*sp.v; }
          if(this.sT>=30){ this.st='idle'; this.atk=null; }
        }
        break;
      }
      case 'hit': {
        this.x += this.vx; this.vx*=.85;
        if(!this.grounded){ this.vy+=.25; this.y+=this.vy; if(this.y>=GY){ this.y=GY; this.grounded=true; } }
        if(this.sT>=this.stun){ this.st='idle'; this.combo=0; }
        break;
      }
      case 'block': {
        this.x += this.vx; this.vx*=.8;
        if(this.sT>=8){ this.st='idle'; }
        break;
      }
      case 'ko': {
        if(!this.grounded){ this.vy+=.25; this.y+=this.vy; this.x-=this.face*1.2; if(this.y>=GY){ this.y=GY; this.grounded=true; } }
        break;
      }
      case 'win': break;
    }
    this.x = Math.max(14, Math.min(306, this.x));
  }
  land(){ this.y=GY; this.vy=0; this.grounded=true; this.st='idle'; this.atk=null; this.landLag=4; }
  startAtk(kind){
    this.st=kind; this.sT=0; this.atk=kind; this.atkHit=false; this.vx=0; sfx.whiff();
  }
  startSpecial(FF){
    this.st='special'; this.sT=0; this.atk='special'; this.atkHit=false; this.cd=160; this.vx=0;
    FF.floaters.push({x:this.x, y:this.y-78, s:this.c.sp.name, life:40, col:this.c.sp.col});
  }
  takeHit(dmg, stun, kb, dir, FF, blocked){
    if(blocked){
      this.hp = Math.max(1, this.hp-1);
      this.st='block'; this.sT=0; this.vx=dir*1.6;
      sfx.block(); FF.sparks(this.x+dir*-8, this.y-40, '#68a0f8', 4);
    } else {
      this.hp = Math.max(0, this.hp-dmg);
      this.st='hit'; this.sT=0; this.stun=stun; this.vx=dir*kb;
      if(!this.grounded) this.vy=-2;
      FF.sparks(this.x, this.y-44, '#f8e048', 8);
      FF.hitstop=5; FF.shakeT=6; FF.shakeMag=Math.min(5,2+dmg*.25);
    }
  }
}

    f.projs.push({x:o.x+o.face*16, y:o.y-(sp.low?14:42), vx:o.face*sp.v, size:sp.size, dmg:sp.dmg, col:sp.col, own:o, stun:20, kb:4});

  const [a,b] = f.p;

// -------- CPU AI --------
function cpuInput(me, opp, f){
  const d = f.diff;
  const aggr = Math.min(.85, .3+.05*d), blockP = Math.min(.65,.08+.05*d);
  const think = Math.max(5, 13-d);
  const inp = {l:0,r:0,u:0,pe:0,ke:0,se:0};
  const dx = opp.x-me.x, adx = Math.abs(dx), dir = dx>0?1:-1;
  const ai = me.ai;
  // dodge projectiles
  for(const pr of f.projs){
    if(pr.own!==me && Math.abs(pr.x-me.x)<55 && Math.sign(pr.vx)!==Math.sign(me.x-pr.x)){
      if(Math.random()<.06+.012*d){ inp.u=1; return inp; }
      if(Math.random()<blockP*.5){ ai.move=-1; ai.until=t+14; }
    }
  }
  if(t>=ai.until && me.st!=='hit'){
    ai.act=null;
    if(opp.attacking && adx<62 && Math.random()<blockP){ ai.move=-1; ai.until=t+18; }
    else if(adx>130){
      const r=Math.random();
      if(me.cd<=0 && r<.28){ ai.act='s'; ai.until=t+10; }
      else if(r<.42){ ai.move=1; ai.act='u'; ai.until=t+12; }
      else { ai.move=1; ai.until=t+think; }
    } else if(adx>58){
      const r=Math.random();
      if(me.cd<=0 && r<.16){ ai.act='s'; ai.until=t+10; }
      else if(r<.24){ ai.move=1; ai.act='u'; ai.until=t+10; }
      else { ai.move=1; ai.until=t+think; }
    } else {
      const r=Math.random();
      if(r<aggr*.5){ ai.act='p'; ai.until=t+think; }
      else if(r<aggr){ ai.act='k'; ai.until=t+think; }
      else if(r<aggr+.12){ ai.move=-1; ai.until=t+16; }
      else if(r<aggr+.2){ ai.act='u'; ai.move=1; ai.until=t+12; }
      else { ai.move=0; ai.until=t+think; }
    }
  }
  if(ai.move===1){ if(dir>0) inp.r=1; else inp.l=1; }
  if(ai.move===-1){ if(dir>0) inp.l=1; else inp.r=1; }
  if(ai.act==='p'){ inp.pe=1; ai.act=null; }
  if(ai.act==='k'){ inp.ke=1; ai.act=null; }
  if(ai.act==='s'){ inp.se=1; ai.act=null; }
  if(ai.act==='u'){ inp.u=1; ai.act=null; }
  return inp;
}

// -------- fight update --------
function updateFight(){
  const f = F, [p1,p2] = f.p;
  if(pressed.start && f.phase==='play'){ paused=!paused; }
  if(paused){
    if(pressed.esc){ paused=false; state='title'; setMusic('menu'); }
    return;
  }
  f.phaseT++;
  if(f.hitstop>0){ f.hitstop--; updateFX(f); return; }

  if(f.phase==='intro'){
    if(f.phaseT===1) sfx.round();
    if(f.phaseT>=100) f.phase='play';
    updateFX(f); return;
  }
  if(f.phase==='ko' || f.phase==='end'){
    for(const p of f.p) p.update({l:0,r:0,u:0,pe:0,ke:0,se:0}, p===p1?p2:p1, f);
    updateFX(f);
    if(f.phase==='ko' && f.phaseT>=130) endRound(f);
    return;
  }
  // play
  f.timerF++;
  if(f.timerF>=60){ f.timerF=0; if(f.timer>0) f.timer--; }
  const i1 = playerInput(), i2 = cpuInput(p2, p1, f);
  p1.update(i1, p2, f);
  p2.update(i2, p1, f);
  // push apart
  const b1=p1.hurtbox(), b2=p2.hurtbox();
  if(b1.x<b2.x+b2.w && b2.x<b1.x+b1.w && p1.grounded && p2.grounded){
    const ov = Math.min(b1.x+b1.w-b2.x, b2.x+b2.w-b1.x)/2;
    if(p1.x<p2.x){ p1.x-=ov/2; p2.x+=ov/2; } else { p1.x+=ov/2; p2.x-=ov/2; }
    p1.x=Math.max(14,Math.min(306,p1.x)); p2.x=Math.max(14,Math.min(306,p2.x));
  }
  // melee hits
  checkHit(p1,p2,f); checkHit(p2,p1,f);
  // projectiles
  for(const pr of f.projs){
    pr.x += pr.vx;
    f.parts.push({x:pr.x-pr.vx, y:pr.y+(Math.random()-.5)*4, vx:0, vy:0, life:6, col:pr.col, g:0});
    const tgt = pr.own===p1?p2:p1;
    const hb = tgt.hurtbox();
    if(pr.x>hb.x && pr.x<hb.x+hb.w && pr.y>hb.y && pr.y<hb.y+hb.h && tgt.st!=='ko'){
      const blocked = tgt.grounded && !tgt.attacking && tgt.st!=='hit' && tgt.holdingAway;
      const wasHit = tgt.st==='hit';
      tgt.takeHit(Math.round(pr.dmg*pr.own.c.pow), pr.stun, pr.kb, Math.sign(pr.vx), f, blocked);
      if(!blocked){ pr.own.combo = wasHit?pr.own.combo+1:1; sfx.hit(); }
      pr.dead=true;
    }
  }
  // proj vs proj cancel
  for(const a of f.projs) for(const b of f.projs)
    if(a!==b && !a.dead && !b.dead && a.own!==b.own && Math.abs(a.x-b.x)<6 && Math.abs(a.y-b.y)<10){
      a.dead=b.dead=true; f.sparks((a.x+b.x)/2,a.y,'#ffffff',10);
    }
  f.projs = f.projs.filter(p=>!p.dead && p.x>-10 && p.x<330);
  updateFX(f);
  // KO / time
  if(p1.hp<=0 || p2.hp<=0){
    f.winner = p1.hp<=0?1:0;
    startKO(f);
  } else if(f.timer<=0){
    f.winner = p1.hp===p2.hp ? -1 : (p1.hp>p2.hp?0:1);
    f.msg = f.winner<0?'DRAW':'TIME UP';
    startKO(f, true);
  }
}
function checkHit(att, def, f){
  const hb = att.hitbox();
  if(!hb || att.atkHit || def.st==='ko') return;
  const db = def.hurtbox();
  if(hb.x<db.x+db.w && db.x<hb.x+hb.w && hb.y<db.y+db.h && db.y<hb.y+hb.h){
    att.atkHit = true;
    let dmg, stun, kb, s;
    if(att.st==='special'){ dmg=att.c.sp.dmg; stun=22; kb=4.5; s='kick'; }
    else { const a=ATK[att.atk]; dmg=a.dmg; stun=a.stun; kb=a.kb; s=a.sfx; }
    const dir = def.x>=att.x?1:-1;
    const blocked = def.grounded && !def.attacking && def.st!=='hit' && def.holdingAway;
    const wasHit = def.st==='hit';
    def.takeHit(Math.round(dmg*att.c.pow), stun, kb, dir, f, blocked);
    if(!blocked){ att.combo = wasHit?att.combo+1:1; sfx[s](); }
    else att.combo=0;
  }
}
function startKO(f, timeup){
  f.phase='ko'; f.phaseT=0;
  if(!timeup){ f.msg='K.O.!'; sfx.ko(); setMusic(null);
    const loser=f.p[1-f.winner]; loser.st='ko'; loser.sT=0; loser.grounded=false; loser.vy=-3.2;
    if(f.winner>=0){ const w=f.p[f.winner]; if(w.hp===w.maxhp) f.perfect=true; }
  } else { setMusic(null); }
  if(f.winner>=0){ const w=f.p[f.winner]; if(w.st!=='ko'){ w.st='win'; w.sT=0; } }
}
function endRound(f){
  if(f.winner>=0) f.wins[f.winner]++;
  if(f.wins[0]>=2 || f.wins[1]>=2){
    f.phase='end'; f.phaseT=0;
    setTimeoutState();
  } else {
    f.round++; resetRound(f); setMusic('fight'); f.perfect=false;
  }
}
function setTimeoutState(){
  const f=F, playerWon = f.wins[0]>=2;
  if(mode==='versus'){ state='result'; resultT=0; setMusic('menu'); }
  else { // arcade
    if(playerWon){
      arcade.wins++;
      if(arcade.stage>=arcade.ladder.length-1){ state='champion'; champT=0; setMusic('menu'); }
      else { arcade.stage++; state='vs'; vsT=0; setMusic('menu'); }
    } else { state='continue'; contT=0; setMusic(null); }
  }
}
function updateFX(f){
  for(const p of f.parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; }
  f.parts = f.parts.filter(p=>p.life>0);
  for(const fl of f.floaters){ fl.y-=.4; fl.life--; }
  f.floaters = f.floaters.filter(p=>p.life>0);
  if(f.shakeT>0) f.shakeT--;
}

// ============================== DRAWING ==============================
function rc(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w,h); }

function drawStage(){
  // ceiling
  rc(0,0,320,16,'#26262e');
  for(let x=20;x<320;x+=60) rc(x,12,24,3,'#e8e0b0');
  // wall
  rc(0,16,320,134,'#b4afa4');
  rc(262,16,58,134,'#98948c'); // concrete pillar
  for(let y=20;y<148;y+=10) rc(264,y,54,1,'#8c8880');
  // glass door
  rc(132,38,58,112,'#c6d2d6'); rc(132,38,58,3,'#787878'); rc(132,38,3,112,'#787878'); rc(187,38,3,112,'#787878'); rc(158,38,3,112,'#8a8a8a');
  rc(140,46,18,40,'#d8e4e8');
  // orange slat partitions
  for(const px of [22,212]){

  }
  // plants
  for(const [px,py] of [[86,96],[100,102],[93,88]]){

  }
  // TV
  rc(4,30,26,18,'#181820'); rc(6,32,22,14, (t>>5)&1 ? '#20284a':'#1c2440');
  // desks
  rc(196,118,60,6,'#8e8e96'); rc(200,124,4,26,'#6e6e76'); rc(248,124,4,26,'#6e6e76');
  rc(206,100,20,16,'#22243c'); rc(208,102,16,12,(t>>4)&1?'#2c3860':'#28305a'); rc(214,116,4,3,'#444');
  rc(60,118,56,6,'#8e8e96'); rc(64,124,4,26,'#6e6e76'); rc(108,124,4,26,'#6e6e76');
  rc(72,101,18,15,'#22243c'); rc(74,103,14,11,'#283058');
  // floor - herringbone-ish wood
  rc(0,150,320,50,'#a8763f');
  for(let y=150;y<200;y+=8){
    rc(0,y,320,1,'#8a5e2e');

    for(let x=off;x<320;x+=40) rc(x,y+1,1,7,'#96682f');
  }
  rc(0,150,320,2,'#7c541f');
}

function drawFighter(p, blink){
  const c = p.c, f = p.face;
  const wf = (p.st==='walk') ? ((t>>3)&1?3:-3) : 0;
  const bob = (p.st==='idle') ? ((t>>4)&1?1:0) : 0;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.fillRect(p.x-12, GY+2, 24, 3);
  if(p.st==='hit' && (p.sT>>1)&1) return; // hit flicker
  ctx.save();
  ctx.translate(p.x|0, p.y|0);
  ctx.scale(f,1);
  const sh=c.shirt, pn=c.pants, sk=c.skin, shoe='#26262a';
  const boss = c.key==='boss'; // shorts
  if(c.key==='dog'){
    const fur=c.shirt, fur2=c.pants, wag=((t>>2)&1)?2:-2;   // fur sampled from the head sprite
    if(p.st==='ko' && p.grounded){
      // on his back, legs in the air
      rc(-18,-9,32,7,fur);
      for(let i=0;i<4;i++) rc(-14+i*8,-15,3,6,fur2);
      const h=heads[c.key];
      if(h){ ctx.save(); ctx.translate(20,-8); ctx.rotate(Math.PI/2); ctx.drawImage(h,-9,-9,18,18); ctx.restore(); }
      if((t>>3)&1){ rc(26,-24,2,2,'#f8e048'); rc(34,-30,2,2,'#f8e048'); }
      ctx.restore(); return;
    }
    let yo=0;
    if(p.st==='win') yo=-Math.abs(Math.sin(t*.15))*4;
    if(p.st==='block') yo=3;                       // crouches to block
    ctx.translate(0,yo);
    rc(-20,-27+wag,5,3,fur2);                      // wagging tail
    rc(-16,-24,30,12,fur); rc(-16,-24,30,3,fur2);  // body
    const wf2=(p.st==='walk')?((t>>3)&1?2:-2):0;
    if(p.st==='jump'||p.st==='air'||(p.st==='ko'&&!p.grounded)){
      rc(-14,-14,4,8,fur2); rc(8,-14,4,8,fur2);    // legs tucked
    } else {
      rc(-14+wf2,-12,4,12,fur2); rc(-7-wf2,-12,4,12,fur2);
      rc(4+wf2,-12,4,12,fur2); rc(11-wf2,-12,4,12,fur2);
    }
    if(p.st==='punch' && p.sT>=ATK.punch.su && p.sT<ATK.punch.su+ATK.punch.act+2){ rc(14,-24,10,4,fur2); }
    if(p.st==='kick' && p.sT>=ATK.kick.su && p.sT<ATK.kick.su+ATK.kick.act+3){ rc(14,-20,14,4,fur); rc(26,-21,4,5,fur2); }
    rc(8,-32,7,9,fur);                              // neck
    const h=heads[c.key];
    if(h){
      const mobile=p.st==='walk'||p.st==='jump'||p.st==='air';
      const hf=(mobile&&p.moveDir)?p.moveDir:f;
      ctx.save(); ctx.translate(13,-34); ctx.scale(hf*f,1);
      ctx.drawImage(h,-11,-11,22,22);
      ctx.restore();
    }
    ctx.restore(); return;
  }
  if(p.st==='ko' && p.grounded){
    // lying flat on his back
    rc(-30,-8,22,6,sh); rc(-8,-7,18,5,pn); rc(10,-6,6,4,shoe);
    rc(-33,-10,5,5,sk); // neck
    const h = heads[c.key];
    if(h){ ctx.save(); ctx.translate(-40,-9); ctx.rotate(-Math.PI/2); ctx.drawImage(h,-11,-11,22,22); ctx.restore(); }
    // dizzy stars
    if((t>>3)&1) { rc(-52,-28,2,2,'#f8e048'); rc(-42,-34,2,2,'#f8e048'); }
    ctx.restore(); return;
  }
  let yo = 0;
  if(p.st==='win') yo = -Math.abs(Math.sin(t*.15))*6;
  ctx.translate(0,yo);
  // legs
  if(p.st==='kick' && p.sT>=ATK.kick.su && p.sT<ATK.kick.su+ATK.kick.act+3){
    rc(-7,-26,5,26,boss?sk:pn); rc(-8,-3,7,3,shoe);
    rc(2,-32,20,5,boss?sk:pn); rc(20,-33,6,5,shoe);   // extended kick
  } else if(p.st==='air'){
    // flying kick: back leg tucked, front leg extended
    rc(-7,-20,5,12,boss?sk:pn); rc(-8,-9,7,3,shoe);
    rc(2,-28,17,5,boss?sk:pn); rc(17,-29,6,5,shoe);
  } else if(p.st==='jump'||(p.st==='ko'&&!p.grounded)){
    rc(-7,-22,5,18,boss?sk:pn); rc(2,-20,5,16,boss?sk:pn);
    rc(-8,-6,7,3,shoe); rc(1,-5,7,3,shoe);
  } else {
    rc(-7+(-wf>>1),-26,5,26,boss?sk:pn); rc(2+(wf>>1),-26,5,26,boss?sk:pn);
    rc(-8+(-wf>>1),-3,7,3,shoe); rc(1+(wf>>1),-3,7,3,shoe);
  }
  if(boss){ rc(-8,-26,16,12,pn); } // shorts over legs
  // torso
  rc(-8,-46,16,20+ (boss?0:0),sh);
  // arms
  const armY=-44;
  if(p.st==='punch'){
    const ext = p.sT>=ATK.punch.su && p.sT<ATK.punch.su+ATK.punch.act+2;
    rc(-10,armY,4,6,sh); rc(-10,armY+6,4,8,sk);          // back arm
    if(ext){ rc(6,armY,16,5,sk); rc(20,armY-1,6,6,sk); } // extended punch + fist
    else { rc(6,armY,10,5,sk); }
  } else if(p.st==='special'){
    rc(-10,armY,4,6,sh); rc(-10,armY+6,4,8,sk);
    rc(6,armY-2,14,4,sk); rc(6,armY+4,14,4,sk);          // both arms forward
    if(p.sT>8 && p.sT<20){ ctx.fillStyle=c.sp.col; ctx.fillRect(20,armY-2,4,10); }
  } else if(p.st==='block'){
    rc(6,-50,5,18,sk); rc(2,-50,4,4,sk);
  } else if(p.st==='win'){
    rc(-10,-58,4,14,sk); rc(6,armY,4,6,sh); rc(6,armY+6,4,8,sk); // arm raised
  } else if(p.st==='hit'){
    rc(-11,armY-2,4,12,sk); rc(7,armY-2,4,12,sk);
  } else if(p.st==='air'){
    rc(-11,armY-4,4,10,sk); rc(7,armY-2,4,8,sk);
  } else {
    rc(-10,armY,4,6,sh); rc(-10,armY+6,4,8,sk);
    rc(6,armY,4,6,sh); rc(6,armY+6,4,8,sk);
  }
  // neck connecting head to torso
  rc(-3,-52+bob,6,8,sk);
  // head: turns instantly toward movement direction, else faces opponent
  const h = heads[c.key];
  if(h){
    const mobile = p.st==='walk'||p.st==='jump'||p.st==='air';
    const hf = (mobile && p.moveDir) ? p.moveDir : f;
    ctx.save(); ctx.scale(hf*f,1); // hf*f: extra flip relative to body space
    ctx.drawImage(h, -12, -72+bob+(p.st==='hit'?2:0), 24, 24);
    ctx.restore();
  }
  ctx.restore();
}

function drawProjs(f){
  for(const pr of f.projs){
    const s = pr.size;
    rc(pr.x-s, pr.y-s, s*2, s*2, pr.col);
    rc(pr.x-s+1, pr.y-s+1, s, s, '#ffffff');
  }
}
function drawParts(f){
  for(const p of f.parts) rc(p.x, p.y, 2, 2, p.col);
  for(const fl of f.floaters){
    if(fl.life>30 || (fl.life>>2)&1) textSh(fl.s, fl.x, fl.y, 1, fl.col, 1);
  }
}

function drawBar(x, y, w, frac, dir){
  rc(x-1,y-1,w+2,10,'#e8e8e8');
  rc(x,y,w,8,'#601010');
  const fw = Math.max(0,Math.round(w*frac));
  if(dir>0) rc(x,y,fw,8,'#f8d800'); else rc(x+w-fw,y,fw,8,'#f8d800');
  if(dir>0) rc(x,y,fw,2,'#fff8a0'); else rc(x+w-fw,y,fw,2,'#fff8a0');
}
function drawHUD(f){
  const [p1,p2]=f.p;
  drawBar(8,6,124,p1.hp/p1.maxhp,-1);
  drawBar(188,6,124,p2.hp/p2.maxhp,1);
  textSh(p1.c.name,8,17,1,'#f8f8f8',0);
  textSh(p2.c.name,312,17,1,'#f8f8f8',2);
  // timer
  rc(146,4,28,14,'#101018'); rc(147,5,26,12,'#282838');
  textSh((''+f.timer).padStart(2,'0'),160,7,2,f.timer<=10?'#f85838':'#f8f8f8',1);
  // round pips
  for(let i=0;i<2;i++){
    rc(140-10-i*8, 20, 6,6, f.wins[0]>i?'#f8d800':'#404048');
    rc(184+i*8, 20, 6,6, f.wins[1]>i?'#f8d800':'#404048');
  }
  // special cooldown
  const c1 = 1-p1.cd/160, c2 = 1-p2.cd/160;
  rc(8,25,40,4,'#282830'); rc(8,25,Math.round(40*c1),4, c1>=1?((t>>3)&1?'#40f0e0':'#20b0a8'):'#20807c');
  rc(272,25,40,4,'#282830'); rc(272+40-Math.round(40*c2),25,Math.round(40*c2),4, c2>=1?((t>>3)&1?'#40f0e0':'#20b0a8'):'#20807c');
  textSh('SP',50,24,1,'#a0a0a8',0); textSh('SP',270,24,1,'#a0a0a8',2);
  // combos
  if(p1.combo>=2 && p2.st==='hit') textSh(p1.combo+' HITS!',40,54,2,'#f8a020',0);
  if(p2.combo>=2 && p1.st==='hit') textSh(p2.combo+' HITS!',280,54,2,'#f85838',2);
}

function drawFight(){
  const f=F;
  ctx.save();
  if(f.shakeT>0){ ctx.translate(((Math.random()-.5)*f.shakeMag)|0, ((Math.random()-.5)*f.shakeMag)|0); }
  drawStage();
  const [p1,p2]=f.p;
  // draw loser behind winner
  if(p1.st==='ko'){ drawFighter(p1); drawFighter(p2); } else { drawFighter(p2); drawFighter(p1); }
  drawProjs(f); drawParts(f);
  ctx.restore();
  drawHUD(f);
  // announcements
  if(f.phase==='intro'){
    if(f.phaseT<55){ textSh(mode==='arcade'?('STAGE '+(arcade.stage+1)+' - ROUND '+f.round):('ROUND '+f.round),160,80,2,'#f8f8f8',1); }
    else { if((f.phaseT>>2)&1) textSh('FIGHT!',160,76,4,'#f85838',1); }
  }
  if(f.phase==='ko'){
    if(f.msg==='K.O.!'){ const sc=Math.max(1,Math.min(5,1+(f.phaseT>>2))); textSh('K.O.!',160,70,sc,'#f83818',1); }
    else textSh(f.msg,160,76,3,'#f8d800',1);
    if(f.perfect && f.phaseT>40) textSh('PERFECT!',160,110,2,'#40f0e0',1);
  }
  if(f.phase==='end'){ textSh(f.p[f.winner].c.name+' WINS!',160,80,2,'#f8d800',1); }
  if(paused){
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,320,200);
    textSh('PAUSED',160,90,3,'#f8f8f8',1);
    textSh('ENTER: RESUME   ESC: QUIT',160,120,1,'#a0a0a8',1);
  }
}

// ============================== SCREENS ==============================
function drawTitle(){
  rc(0,0,320,200,'#181828');
  // marching faces marquee
  for(let i=0;i<ROSTER.length;i++){
    const x = ((i*34 - t*.6) % (ROSTER.length*34) + ROSTER.length*34) % (ROSTER.length*34) - 20;
    const h = ovals[ROSTER[i].key];
    if(h) ctx.drawImage(h, x|0, 166+((Math.sin(t*.1+i)*3)|0), 20,20);
  }
  // logo
  textSh('OFFICE',160,26,5,'#f8d800',1);
  textSh('FIGHTER II',160,58,5,'#f85838',1);
  textSh('* HAPPY HOUR: ROUND 2 *',160,92,1,'#40f0e0',1);
  const items=['VS CPU','ARCADE LADDER'];
  for(let i=0;i<2;i++){
    const selc = titleSel===i;
    textSh(items[i],160,116+i*14,1,selc?'#f8f8f8':'#787888',1);
    if(selc && (t>>4)&1){ textSh('>',108,116+i*14,1,'#f8d800',0); textSh('<',212,116+i*14,1,'#f8d800',0); }
  }
  if(MOBILE){
    textSh('D-PAD: MOVE AND JUMP  *  HOLD BACK TO BLOCK',160,150,1,'#606070',1);
    textSh('PUNCH  KICK  SPECIAL: BIG BUTTONS',160,158,1,'#606070',1);
  } else {
    textSh('ARROWS/WASD MOVE  Z/J PUNCH  X/K KICK  C/L SPECIAL',160,150,1,'#606070',1);
    textSh('HOLD BACK TO BLOCK   M MUSIC   V CRT',160,158,1,'#606070',1);
  }
  if((t>>5)&1) textSh(MOBILE?'TAP START':'PRESS ENTER',160,138,1,'#f8f8f8',1);
}
function updateTitle(){
  if(pressed.u||pressed.d){ titleSel=1-titleSel; sfx.move(); }
  if(pressed.start){
    mode = titleSel===0?'versus':'arcade';
    sel={phase:0,cur:0,p1:0,p2:0,dsel:1};
    state='select'; sfx.sel();
  }
}

function drawSelect(){
  rc(0,0,320,200,'#181828');
  rc(0,0,320,26,'#101018');
  const hdr = sel.phase===0 ? 'CHOOSE YOUR FIGHTER' : sel.phase===1 ? 'CHOOSE YOUR OPPONENT' : 'SELECT DIFFICULTY';
  textSh(hdr,160,8,2,sel.phase===1?'#f85838':'#f8d800',1);
  // grid 7 x 3
  for(let i=0;i<ROSTER.length;i++){
    const gx = 8+(i%7)*44, gy = 30+((i/7)|0)*44;
    const im = portraits[ROSTER[i].key];
    rc(gx-2,gy-2,44,44,'#33334a');
    if(im) ctx.drawImage(im,gx,gy,40,40);
    if(sel.phase>=1 && i===sel.p1){ ctx.strokeStyle='#f8d800'; ctx.strokeRect(gx-1.5,gy-1.5,43,43); textSh('P1',gx+2,gy+2,1,'#f8d800',0); }
    if(sel.phase>=2 && i===sel.p2){ ctx.strokeStyle='#f85838'; ctx.strokeRect(gx-1.5,gy-1.5,43,43); textSh('CPU',gx+2,gy+34,1,'#f85838',0); }
    if(i===sel.cur && sel.phase<2 && (t>>3)&1){
      ctx.strokeStyle = sel.phase===0?'#f8d800':'#f85838';
      ctx.strokeRect(gx-2.5,gy-2.5,45,45);
    }
  }
  // compact info panel
  const c = ROSTER[sel.cur];
  rc(0,160,320,40,'#101018');
  const im = portraits[c.key];
  if(im) ctx.drawImage(im,6,162,36,36);
  textSh(c.name,48,163,2,'#f8f8f8',0);
  textSh('ENTER:OK ESC:BACK R:RANDOM',312,167,1,'#606070',2);
  const st=[['PWR',c.pow/1.3],['SPD',c.spd/2.0],['HP',c.hp/125]];
  for(let i=0;i<3;i++){
    textSh(st[i][0],48+i*92,180,1,'#a0a0a8',0);
    rc(64+i*92,180,52,5,'#282838');
    rc(64+i*92,180,Math.round(52*Math.min(1,st[i][1])),5,['#f85838','#40f0e0','#f8d800'][i]);
  }
  textSh('SPECIAL: '+c.sp.name,48,190,1,'#40f0e0',0);
  // difficulty overlay
  if(sel.phase===2){
    ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(40,60,240,80);
    ctx.strokeStyle='#f8d800'; ctx.strokeRect(40.5,60.5,239,79);
    textSh('DIFFICULTY',160,70,2,'#f8d800',1);
    const ds=['EASY','NORMAL','HARD'];
    for(let i=0;i<3;i++){
      const s = sel.dsel===i;
      textSh(ds[i],110+i*50,100,1,s?'#f8f8f8':'#686878',1);
      if(s&&(t>>4)&1){ textSh('>',110+i*50-20,100,1,'#f8d800',1); }
    }
    textSh('ENTER TO START',160,120,1,'#a0a0a8',1);
  }
}
function updateSelect(){
  const N=ROSTER.length, COLS=7, nRows=Math.ceil(N/COLS);
  const rowLen = r => Math.min(COLS, N-r*COLS);
  if(sel.phase<2){
    const col=sel.cur%COLS, row=(sel.cur/COLS)|0;
    if(pressed.l){ sel.cur=row*COLS+((col+rowLen(row)-1)%rowLen(row)); sfx.move(); }
    if(pressed.r){ sel.cur=row*COLS+((col+1)%rowLen(row)); sfx.move(); }
    if(pressed.u){ const nr=(row+nRows-1)%nRows; sel.cur=nr*COLS+Math.min(col,rowLen(nr)-1); sfx.move(); }
    if(pressed.d){ const nr=(row+1)%nRows; sel.cur=nr*COLS+Math.min(col,rowLen(nr)-1); sfx.move(); }
    if(pressed.rnd){ sel.cur=(Math.random()*N)|0; sfx.move(); }
    if(pressed.esc){
      if(sel.phase===1){ sel.phase=0; sel.cur=sel.p1; } else state='title';
      sfx.move(); return;
    }
    if(pressed.start){
      sfx.sel();
      if(sel.phase===0){
        sel.p1=sel.cur;
        if(mode==='arcade'){
          arcade.hero=sel.p1; arcade.stage=0; arcade.wins=0;
          arcade.ladder = ROSTER.map((_,i)=>i).filter(i=>i!==sel.p1);
          for(let i=arcade.ladder.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [arcade.ladder[i],arcade.ladder[j]]=[arcade.ladder[j],arcade.ladder[i]]; }
          state='vs'; vsT=0;
        } else { sel.phase=1; sel.cur=(sel.cur+7)%ROSTER.length; }
      } else {
        sel.p2=sel.cur; sel.phase=2;
      }
    }
  } else {
    if(pressed.l){ sel.dsel=(sel.dsel+2)%3; sfx.move(); }
    if(pressed.r){ sel.dsel=(sel.dsel+1)%3; sfx.move(); }
    if(pressed.esc){ sel.phase=1; return; }
    if(pressed.start){ diff=[2,5,9][sel.dsel]; sfx.sel(); state='vs'; vsT=0; }
  }
}

function fightPair(){
  return mode==='arcade' ? [arcade.hero, arcade.ladder[arcade.stage]] : [sel.p1, sel.p2];
}
function drawVS(){
  rc(0,0,320,200,'#181828');
  const [a,b]=fightPair();
  const ia=portraits[ROSTER[a].key], ib=portraits[ROSTER[b].key];
  rc(28,48,88,88,'#33334a'); rc(204,48,88,88,'#33334a');
  if(ia) ctx.drawImage(ia,32,52,80,80);
  if(ib) ctx.drawImage(ib,208,52,80,80);
  textSh(ROSTER[a].name,72,140,1,'#f8d800',1);
  textSh(ROSTER[b].name,248,140,1,'#f85838',1);
  const sc = 3+((t>>4)&1);
  textSh('VS',160,84,sc,'#f85838',1);
  if(mode==='arcade'){
    textSh('STAGE '+(arcade.stage+1)+' OF '+arcade.ladder.length,160,20,2,'#f8f8f8',1);
    textSh('WINS: '+arcade.wins,160,164,1,'#40f0e0',1);
  } else {
    textSh(['EASY','NORMAL','HARD'][sel.dsel]+' CPU',160,20,2,'#f8f8f8',1);
  }
  if((t>>4)&1) textSh('GET READY!',160,180,1,'#a0a0a8',1);
}
function updateVS(){
  vsT++;
  if(vsT>150 || pressed.start){
    const [a,b]=fightPair();
    const d = mode==='arcade' ? Math.min(11, 1+arcade.stage) : diff;
    F = newFight(a,b,d); paused=false;
    state='fight'; setMusic('fight');
  }
}

function drawResult(){
  rc(0,0,320,200,'#181828');
  const f=F, w=f.p[f.winner], playerWon=f.winner===0;
  const im = portraits[w.c.key];
  rc(116,30,88,88,'#33334a');
  if(im) ctx.drawImage(im,120,34,80,80);
  textSh(playerWon?'YOU WIN!':'CPU WINS!',160,10,2,playerWon?'#f8d800':'#f85838',1);
  textSh(w.c.name,160,124,2,'#f8f8f8',1);
  textSh("'"+w.c.quote+"'",160,142,1,'#40f0e0',1);
  textSh('ENTER: REMATCH',160,164,1,(t>>4)&1?'#f8f8f8':'#a0a0a8',1);
  textSh('BACKSPACE: NEW FIGHTERS   ESC: TITLE',160,176,1,'#606070',1);
}
function updateResult(){
  resultT++;
  if(pressed.start){ const [a,b]=fightPair(); F=newFight(a,b,diff); paused=false; state='fight'; setMusic('fight'); sfx.sel(); }
  if(pressed.back){ sel.phase=0; sel.cur=sel.p1; state='select'; sfx.sel(); }
  if(pressed.esc){ state='title'; sfx.move(); }
}

function drawContinue(){
  rc(0,0,320,200,'#100810');
  const n = 9-Math.min(9,(contT/60)|0);
  textSh('CONTINUE?',160,40,3,'#f85838',1);
  textSh(''+n,160,80,6,(t>>3)&1?'#f8f8f8':'#f8d800',1);
  textSh('ENTER: FIGHT ON!',160,140,1,'#f8f8f8',1);
  textSh('ESC: GIVE UP',160,152,1,'#606070',1);
  textSh('WINS: '+arcade.wins,160,170,1,'#40f0e0',1);
}
function updateContinue(){
  contT++;
  if(pressed.start){ state='vs'; vsT=0; sfx.sel(); setMusic('menu'); }
  else if(pressed.esc || contT>600){ state='title'; setMusic('menu'); }
}

function drawChampion(){
  rc(0,0,320,200,'#181828');
  // confetti
  if(F){ if(t%3===0) F.parts.push({x:Math.random()*320,y:-4,vx:(Math.random()-.5),vy:1+Math.random(),life:120,col:['#f8d800','#f85838','#40f0e0','#b06ce8'][(Math.random()*4)|0],g:.01});
    updateFX(F); drawParts(F); }
  const im = portraits[ROSTER[arcade.hero].key];
  textSh('OFFICE CHAMPION!',160,14,2,'#f8d800',1);
  rc(116,34,88,88,'#f8d800');
  if(im) ctx.drawImage(im,120,38,80,80);
  textSh(ROSTER[arcade.hero].name,160,128,2,'#f8f8f8',1);
  textSh('ALL 11 CHALLENGERS DEFEATED!',160,146,1,'#40f0e0',1);
  // the defeated
  const lx = 160 - arcade.ladder.length*8;
  for(let i=0;i<arcade.ladder.length;i++){
    const h=heads[ROSTER[arcade.ladder[i]].key];
    if(h) ctx.drawImage(h, lx+i*16, 158, 16,16);
  }
  if((t>>4)&1) textSh('ENTER: TITLE',160,184,1,'#a0a0a8',1);
}
function updateChampion(){ champT++; if(pressed.start && champT>30){ state='title'; sfx.sel(); } }

// ============================== MAIN LOOP ==============================
function update(){
  t++;
  if(pressed.mus){ musicOn=!musicOn; }
  if(pressed.crt){ crt.classList.toggle('off'); }
  switch(state){
    case 'boot': if(loaded>=ROSTER.length*2){ state='title'; setMusic('menu');
      if(location.hash.includes('demo')){ F=newFight(0,18,5); F.phase='play'; state='fight'; }
      if(location.hash.includes('ko')){ F=newFight(0,11,5); state='fight'; F.phase='ko'; F.phaseT=-100000; F.msg='K.O.!'; F.winner=0;
        F.p[1].hp=0; F.p[1].st='ko'; F.p[1].grounded=true; F.p[0].st='win'; }
      if(location.hash.includes('sel')){ state='select'; }
      if(location.hash.includes('air')){ F=newFight(0,11,5); state='fight'; F.phase='intro'; F.phaseT=-100000;
        const a=F.p[0]; a.x=190; a.y=GY-34; a.grounded=false; a.st='air'; a.sT=10; a.atk='air'; F.p[1].x=230; } } break;
    case 'title': updateTitle(); break;
    case 'select': updateSelect(); break;
    case 'vs': updateVS(); break;
    case 'fight': updateFight(); break;
    case 'result': updateResult(); break;
    case 'continue': updateContinue(); break;
    case 'champion': updateChampion(); break;
  }
  for(const k in pressed) pressed[k]=0;
}
function render(){
  ctx.clearRect(0,0,320,200);
  switch(state){
    case 'boot': rc(0,0,320,200,'#000'); textSh('LOADING FIGHTERS...',160,92,1,'#f8d800',1); break;
    case 'title': drawTitle(); break;
    case 'select': drawSelect(); break;
    case 'vs': drawVS(); break;
    case 'fight': drawFight(); break;
    case 'result': drawResult(); break;
    case 'continue': drawContinue(); break;
    case 'champion': drawChampion(); break;
  }
}
let last=performance.now(), acc=0;
function loop(now){
  acc += Math.min(100, now-last); last=now;
  while(acc>=1000/60){ update(); acc-=1000/60; }
  musicTick();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
